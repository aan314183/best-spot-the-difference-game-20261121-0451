<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Lane — Spot the Difference</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>🔍 LANTERN LANE</h1>
    <div class="subtitle">SPOT THE DIFFERENCE · <span id="sceneName">Firefly Night Market</span></div>
  </div>
  <div class="hud">
    <nav class="leveltabs" aria-label="Scenes">
      <button data-scene="0">🏮 1</button>
      <button data-scene="1">🐠 2</button>
      <button data-scene="2">🏔️ 3</button>
    </nav>
    <span class="pill timer" id="timer">⏱ 03:00</span>
    <span class="pill counter" id="counter"><b>10</b> LEFT</span>
    <span class="pill" id="score">Score <b>0</b></span>
    <button class="hudbtn" id="hintBtn">💡 Hint (3) −50</button>
    <button class="hudbtn ghost" id="restartBtn">↻ Restart</button>
    <button class="hudbtn ghost" id="muteBtn">🔊 Sound</button>
  </div>
</header>
<div class="timebar" id="timebar"><div id="timefill" style="width:100%"></div></div>
<main class="panels">
  <div class="panel" id="panelLeft"></div>
  <div class="panel" id="panelRight"></div>
</main>
<footer class="foot">
  <div id="message">Loading the lanterns…</div>
  <div class="keys"><kbd>Click</kbd> a difference · <kbd>H</kbd> hint · <kbd>R</kbd> restart · <kbd>1–3</kbd> scene · <kbd>M</kbd> mute</div>
</footer>
<div class="overlay hidden" id="overlay"></div>
<script src="scenes.js"></script>
<script src="render.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
<script src="main.js"></script>
</body>
</html>
